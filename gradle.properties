# Note : -Djava.net.preferIPv4Stack requis dans certains environnements réseau
# (sinon le client Gradle ne parvient pas à dialoguer avec son daemon).
# Le proxy éventuel se configure dans ~/.gradle/gradle.properties (non versionné).
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
